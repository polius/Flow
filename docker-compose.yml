services:
  flow:
    # image: poliuscorp/flow:latest
    build: .
    ports:
      # 0.0.0.0 — LAN access intended; no-auth trade-off accepted (DESIGN.md §13.5)
      - "8080:8080"
    volumes:
      # One folder for everything: ./flow/music holds your files (Flow never
      # writes there — edits are SQLite overlays) and ./flow/data holds the
      # index, created automatically on first start.
      - ./flow:/flow
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
