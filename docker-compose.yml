services:
  flow:
    image: poliuscorp/flow
    ports:
      - "8080:8080"
    volumes:
      - ./flow:/flow
    # environment:
    #   # Sets the login password on first start (auth is off by default).
    #   FLOW_PASSWORD: "change-me"
    #   # Run as the host user that owns your music (default 1000:1000).
    #   PUID: "1000"
    #   PGID: "1000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
