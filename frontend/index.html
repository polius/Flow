<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the installed app draws edge to edge, and the
         chrome pads itself with env(safe-area-inset-*) — without it every
         inset reads 0 and the app is letterboxed on notched phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- A readable tab and an installable app. The theme-color rides each
         ramp so the browser chrome matches the app's own tokens. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-light.png" />
    <link rel="manifest" href="/manifest-light.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161618" />
    <!-- The standard name alongside the legacy tag (which stays for
         older iOS) — the old one alone logs a deprecation on every load. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flow" />
    <title>Flow</title>
    <script>
      // Set the theme ramp before first paint, so a dark-mode load never
      // flashes light — mirrors lib/theme.ts.
      try {
        var stored = JSON.parse(localStorage.getItem("flow.ui") || "{}");
        var mode = stored.state ? stored.state.themeMode : null;
        var dark =
          mode === "dark" ||
          ((mode === null || mode === "system") &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        // The chosen Home Screen icon — mirrors lib/homeIcon.ts.
        if (stored.state && stored.state.homeIcon === "dark") {
          document
            .querySelector('link[rel="apple-touch-icon"]')
            .setAttribute("href", "/icons/apple-touch-icon.png");
          document
            .querySelector('link[rel="manifest"]')
            .setAttribute("href", "/manifest.webmanifest");
        }
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
