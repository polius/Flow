name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The full CI suite, docker smoke test included, on the tagged commit.
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    name: Tag matches the app version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with backend/app/__init__.py and frontend/package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${TAG#v}"
          backend=$(python3 -c 'import re,sys; print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", open("backend/app/__init__.py").read())[1])')
          frontend=$(python3 -c 'import json; print(json.load(open("frontend/package.json"))["version"])')
          echo "tag=$tag backend=$backend frontend=$frontend"
          if [ "$tag" != "$backend" ] || [ "$tag" != "$frontend" ]; then
            echo "::error::Release tag $TAG does not match the app version (backend $backend, frontend $frontend). Bump backend/app/__init__.py and frontend/package.json first."
            exit 1
          fi

  push_to_registry:
    name: Push Docker image to Docker Hub
    needs: [ci, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: poliuscorp
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # X.Y.Z always; X.Y, X and latest only for a full release, so a
      # prerelease (a GitHub prerelease or a -rc/-beta tag) never moves them.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: poliuscorp/flow
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}

      # The Python stage runs under emulation for arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/poliuscorp/flow
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
