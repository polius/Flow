version: 2
# Patch and minor bumps come in separate groups, so a held-back one (see
# dependabot-automerge.yml: 0.x minors and new base-image versions wait
# for review) doesn't hold up the patches.
updates:
  # Python backend dependencies: requirements.in is the input,
  # requirements.txt the hash-locked compile of it.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "daily"
    groups:
      pip-patch:
        update-types:
          - "patch"
      pip-minor:
        update-types:
          - "minor"

  # Frontend dependencies (frontend/package-lock.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    groups:
      npm-patch:
        update-types:
          - "patch"
      npm-minor:
        update-types:
          - "minor"

  # Base images (Dockerfile, pinned by tag and digest)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      docker-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows (pinned by commit SHA)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
