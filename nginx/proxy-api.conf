# Shared proxy settings for every location that forwards to uvicorn.
proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $flow_forwarded_proto;
# Unbuffered keeps SSE (scan progress) streaming.
proxy_buffering off;
# nginx adds these to every response (headers-common.conf); drop the app's
# own copy so none is sent twice.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
