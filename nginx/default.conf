# Flow — full nginx config (main context), tuned to run as a non-root user
# inside the container (DESIGN.md §10).
#
# Ports: nginx listens on 8080 because a non-root process cannot bind 80;
# the container maps host 8080 → container 8080.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Writable temp paths for the non-root worker processes.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 8080;
        server_name _;

        root /app/static;
        index index.html;

        # --- API → uvicorn -----------------------------------------------
        # proxy_buffering off keeps SSE (scan progress) streaming.
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # --- Audio streaming ----------------------------------------------
        # FastAPI resolves the track and answers with an X-Accel-Redirect
        # into this internal location; nginx then serves the bytes itself
        # with native sendfile + Range support (DESIGN.md §6, §13.1).
        # NOTE: X-Accel-Redirect paths must be URL-encoded by the API.
        location /music-internal/ {
            internal;
            alias /flow/music/;
        }

        # --- Repaired audio (self-healing scan, DESIGN.md §38) --------------
        # Tracks rescued from mislabeled containers stream their remuxed copy
        # from the data dir; originals stay untouched under /flow/music.
        location /repaired-internal/ {
            internal;
            alias /flow/data/repaired/;
        }

        # --- Built frontend (SPA) ------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Hashed asset filenames → cache hard.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
