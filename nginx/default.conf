# Two workers are plenty for one household; "auto" spawns one per core
# (10+ on a NAS), each with its own buffers.
worker_processes 2;
pid /tmp/nginx/nginx.pid;
# "stderr" is nginx's special-cased fd-2 target: writing the inherited
# descriptor directly, with no path to open. "/dev/stderr" needs open()
# on /proc/self/fd/2, which fails (13) for a non-root master whose
# privileges were dropped via setuid (su-exec) — the kernel marks the
# process non-dumpable and /proc/self/fd becomes root-owned.
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # No version in the Server header or on error pages.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    # Compress uvicorn's JSON too — nginx skips proxied responses by default.
    gzip_proxied any;

    # --- Client address behind a reverse proxy ---------------------------
    # With FLOW_TRUSTED_PROXIES set, start.sh writes `set_real_ip_from`
    # lines plus `real_ip_header X-Forwarded-For` here, so the rate limit
    # below keys on each real client instead of the proxy's one address.
    # Empty otherwise.
    include /tmp/nginx/realip.conf;

    # --- Brute-force guard ---------------------------------------------------
    # Only the password checks are throttled: login, and changing or
    # disabling the password. 10 attempts/min per client IP; burst=5 with
    # nodelay absorbs a hasty typo spree without artificial delay, but a
    # dictionary run collects 429s. Page loads (/api/auth/status), library,
    # stream, and scan traffic never pass a limit_req. (Dev traffic — the
    # Vite proxy — bypasses nginx entirely; the backend additionally sleeps
    # briefly on bad passwords, so nothing depends on this alone.)
    limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/m;
    limit_req_status 429;

    # The scheme the browser used: a TLS-terminating proxy in front says so
    # in X-Forwarded-Proto. uvicorn trusts it from 127.0.0.1 (nginx), which
    # lets the session cookie be marked Secure behind HTTPS.
    map $http_x_forwarded_proto $flow_forwarded_proto {
        default $scheme;
        https   https;
    }

    # Writable temp paths for the non-root worker processes.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 8080;
        server_name _;

        root /app/static;
        index index.html;

        # Security headers for every response. An add_header inside a
        # location drops all of these, so each such location re-includes
        # the file.
        include /app/nginx/security-headers.conf;

        # --- Password checks → uvicorn (rate limited) ---------------------
        location = /api/auth/login {
            limit_req zone=auth burst=5 nodelay;
            include /app/nginx/proxy-api.conf;
        }

        location = /api/auth/password {
            limit_req zone=auth burst=5 nodelay;
            include /app/nginx/proxy-api.conf;
        }

        # --- API → uvicorn -----------------------------------------------
        location /api/ {
            include /app/nginx/proxy-api.conf;
            proxy_read_timeout 3600s;
            # Cover uploads: the backend accepts up to 10 MB — nginx's 1 MB
            # default 413'd anything larger before it reached uvicorn.
            client_max_body_size 12m;
        }

        # --- Audio streaming ----------------------------------------------
        location /music-internal/ {
            internal;
            alias /flow/music/;
        }

        # --- Repaired audio (self-healing scan) --------------
        location /repaired-internal/ {
            internal;
            alias /flow/data/repaired/;
        }

        # --- Built frontend (SPA) ------------------------------------------
        location / {
            # index.html and the PWA files revalidate on every load: they
            # name the hashed assets, so a cached index pins the whole UI
            # to an old build. Assets stay immutable under /assets/.
            try_files $uri $uri/ /index.html;
            include /app/nginx/security-headers.conf;
            add_header Cache-Control "no-cache";
        }

        # The service worker's offline fallback: a standalone page with its
        # own inline styles and a one-line onclick retry. It is static (no
        # user data can reach it), so inline script is allowed here only.
        location = /offline.html {
            include /app/nginx/headers-common.conf;
            add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
            add_header Cache-Control "no-cache";
        }

        # Hashed asset filenames → cache hard.
        location /assets/ {
            include /app/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
