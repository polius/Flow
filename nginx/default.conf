worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Brute-force guard ---------------------------------------------------
    # The auth endpoints are the only paths worth throttling. 10 attempts/min
    # per client IP; burst=5 with nodelay absorbs a hasty typo spree without
    # artificial delay, but a dictionary run collects 429s. Library, stream,
    # and scan traffic never passes a limit_req. (Dev traffic — the Vite
    # proxy — bypasses nginx entirely; the backend additionally sleeps
    # briefly on bad passwords, so nothing depends on this alone.)
    limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/m;
    limit_req_status 429;

    # Writable temp paths for the non-root worker processes.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 8080;
        server_name _;

        root /app/static;
        index index.html;

        # --- Auth → uvicorn (rate limited; must precede the /api/ block) ---
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
        }

        # --- API → uvicorn -----------------------------------------------
        # proxy_buffering off keeps SSE (scan progress) streaming.
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            # Cover uploads: the backend accepts up to 10 MB — nginx's 1 MB
            # default 413'd anything larger before it reached uvicorn.
            client_max_body_size 12m;
        }

        # --- Audio streaming ----------------------------------------------
        location /music-internal/ {
            internal;
            alias /flow/music/;
        }

        # --- Repaired audio (self-healing scan) --------------
        location /repaired-internal/ {
            internal;
            alias /flow/data/repaired/;
        }

        # --- Built frontend (SPA) ------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Hashed asset filenames → cache hard.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
