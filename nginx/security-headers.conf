# Security headers for the app. Included at server level and again in any
# location with its own add_header (which would otherwise drop these).
include /app/nginx/headers-common.conf;
# Same-origin everything. The inline theme script in index.html is allowed
# by its hash: the image build replaces __INLINE_SCRIPT_HASHES__ with the
# sha256 of each inline <script> in the built page (docker/csp-hashes.py).
# Styles allow inline for style attributes; blob: covers local cover-upload
# previews.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __INLINE_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
